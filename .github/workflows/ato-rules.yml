name: ATO rules reminder

# The ATO publishes the new income year's rates, thresholds and caps from
# about May to August. It turns away scripted requests from GitHub's servers
# (403), so this can't fetch the pages itself. Instead it opens an issue on
# 1 July, 1 August and 1 September (if one isn't open already) with the steps
# to refresh the snapshot from a browser. The engine test
# src/golden/ato.snapshot.test.ts then lists which rules need updating.
on:
  schedule:
    - cron: "0 0 1 7,8,9 *" # 00:00 UTC on the 1st, mid-morning in Australia
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Open the reminder issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: Refresh the ATO rules snapshot
        run: |
          set -euo pipefail
          open=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            echo "Issue #$open is still open; leaving it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > body.md <<'BODY'
          The ATO publishes the new year's tax, HELP, Medicare and super figures between May and August. Time to check whether the engine is up to date.

          1. Open any page on https://www.ato.gov.au in a browser (or ask Claude to do it with the built-in browser).
          2. Paste [`scripts/ato-snapshot.browser.js`](../blob/main/scripts/ato-snapshot.browser.js) into the developer console. It prints the snapshot and copies it to the clipboard.
          3. Save it over `packages/engine/src/golden/data/ato-pages.json` on a new branch and run `pnpm lint:fix`.
          4. Run `pnpm --filter @budgy/engine test`. If `ato.snapshot.test.ts` fails, its log has a table of each value to change, with the ATO page it comes from.
          5. Update `TAX_RULES` (tax/rules.ts), `SUPER_RULES` (super/rules.ts) and `HELP_INDEXATION` / `HELP_THRESHOLDS_PUBLISHED_TO` (help/early.ts) until it passes. Drop any `notes` about carried values the ATO has now published.
          6. If tax rates changed, check the withholding coefficients and golden cases in `packages/engine/src/golden`, and move `checked` on in `golden/sources.ts`.

          If nothing in the snapshot changed, close this issue.
          BODY
          gh issue create --title "$TITLE" --body-file body.md
